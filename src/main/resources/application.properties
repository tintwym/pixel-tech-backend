spring.application.name=pixel-tech-backend

# Server (Cloud Run sets PORT; Docker host maps 8081→8080)
server.port=${PORT:8080}

# Database — Neon PostgreSQL
# Primary: set DATABASE_URL in .env (postgresql://user:pass@host/db?sslmode=require)
# DatabaseConfig creates the DataSource when DATABASE_URL is non-empty.
# Fallback JDBC settings apply only when DATABASE_URL is unset:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shoppingcart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shoppingcart}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shoppingcart}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Actuator (Cloud Run health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# JWT — set JWT_SECRET in .env (min 32 characters)
jwt.secret=${JWT_SECRET:local-dev-secret-key-for-jwt-testing-32b}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Stripe — set STRIPE_API_KEY and STRIPE_WEBHOOK_SECRET in .env
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder_for_local_dev}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Frontend — set APP_FRONTEND_BASE_URL in .env (Stripe redirect + CORS)
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
# Admin dashboard origin (CORS) — set APP_ADMIN_BASE_URL to the deployed admin URL
app.admin.base-url=${APP_ADMIN_BASE_URL:}

# Optional: mobile deep links for Stripe return URLs (leave unset for web)
app.checkout.success-url=${APP_CHECKOUT_SUCCESS_URL:}
app.checkout.cancel-url=${APP_CHECKOUT_CANCEL_URL:}

# Cloudinary — product image uploads (set in .env)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:pixel-tech/products}

# AI (Gemini) — set GEMINI_API_KEY in .env; /api/ai/** returns 503 when unset
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
app.ai.global-requests-per-minute=${AI_GLOBAL_REQUESTS_PER_MINUTE:120}

# Optional — create first admin on startup (set on Cloud Run for production)
app.admin.seed-username=${ADMIN_SEED_USERNAME:}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:}
