# Pixel Tech API — Docker + Neon PostgreSQL
#
# Prerequisites:
#   1. Copy .env.example → .env
#   2. Set DATABASE_URL to a Neon DB dedicated to Pixel Tech (do not reuse Aura Fresh DB)
#   3. Fill JWT_SECRET and other keys
#
# Run:
#   docker compose --env-file .env up --build
#
# API: http://localhost:8081/api

services:
  api:
    build: .
    container_name: pixel-tech-api
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      # Neon — required (from .env). Do not run a local Postgres container.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Neon postgresql:// URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 characters)}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-pixel-tech/products}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
